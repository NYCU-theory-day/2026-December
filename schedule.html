<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="l5IildTRONKMW6E33TQVciUE6KtFiAXQJB9olCn_PnI" />
  <title>Schedule – NYCU Theory Day 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="page-container">

<main>
  
  <h1>Program</h1>
  <br />
  <div class="program-actions">
    <button id="download-program-pdf" class="button-link" type="button">Download program PDF</button>
  </div>
  <p class="subtitle">Note: Part 1 is for Day 1 and 3, and Part 2 is for Day 2. Clicking the button downloads both parts.</p>

  <!-- Day tabs -->
  <div id="day-tabs" class="day-tabs"></div>

  <!-- Per-day schedule content -->
  <div id="schedule-day" class="schedule-day"></div>
  
  <!-- Speaker Modal -->
  <div id="speaker-modal" class="speaker-modal">
    <div class="speaker-modal-content">
      <span class="speaker-modal-close">&times;</span>
      <img id="speaker-modal-photo" class="speaker-modal-photo" src="" alt="Speaker Photo">
      <div class="speaker-modal-info">
        <h2 id="speaker-modal-name" class="speaker-modal-name"></h2>
        <p><strong>Affiliation:</strong> <span id="speaker-modal-affiliation" class="speaker-modal-affiliation"></span></p>
        <p id="speaker-modal-talk-title-row"><strong>Talk Title:</strong> <span id="speaker-modal-talk-title" class="speaker-modal-talk-title"></span></p>
        <div id="speaker-modal-abstract-row" class="speaker-modal-abstract-section">
          <strong>Abstract:</strong>
          <p id="speaker-modal-abstract" class="speaker-modal-abstract"></p>
        </div>
      </div>
    </div>
  </div>
  
  <script src="schedule.js?v=1"></script>
</main>

<script src="cache-utils.js?v=1"></script>
<script>
  if (window.cacheUtils && typeof window.cacheUtils.setupAutoUpdateCheck === 'function') {
    window.cacheUtils.setupAutoUpdateCheck({ versionUrl: 'site-version.json', intervalMs: 120000 });
  }
</script>
<script src="load-footer.js?v=1"></script>
<script src="load-header.js?v=1"></script>
<script src="load-hero.js?v=1"></script>
<script src="page-loader.js?v=1"></script>
<script src="speaker.js?v=1"></script>
<script src="schedule.js?v=1"></script>
<script src="banner.js?v=1"></script>


</div>
</body>
</html>
