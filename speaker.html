<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="google-site-verification" content="l5IildTRONKMW6E33TQVciUE6KtFiAXQJB9olCn_PnI" />
  <title>Speaker – NYCU Theory Day 2026</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="style.css" />
</head>



<body>

<div class="page-container">

<main>

  <section class="speakers-section">
    <!-- Speaker details are stored at speaker.js-->

    <!-- Category Tabs -->
    <div class="speaker-category-tabs" id="speaker-category-tabs"></div>

    <p class="speaker-note">* listed in alphabetical order.</p>
    
    <!-- Tabs -->
    <div class="speaker-tabs" id="speaker-tabs"></div>

    <!-- Speaker Content -->
    <div class="speaker-content">

      <!-- Photo -->
      <div class="speaker-photo">
        <img id="speaker-photo"
             src="https://via.placeholder.com/300x400"
             alt="Speaker Photo">
      </div>

      <!-- Details -->
      <div class="speaker-details">

        <h2 class="speaker-name" id="speaker-name">
          PLACEHOLDER NAME
        </h2>

        <div class="speaker-title" id="speaker-title">
          PLACEHOLDER TITLE
        </div>

        <div class="speaker-affiliation" id="speaker-affiliation">
          PLACEHOLDER AFFILIATION
        </div>

        <div class="speaker-expertise" id="speaker-expertise">
          PLACEHOLDER EXPERTISE
        </div>

        <div class="speaker-abstract-box" id="speaker-abstract-box">
          <div class="speaker-talk-title-row">
            <p id="speaker-talk-title" style="font-size: 1.16rem;">PLACEHOLDER TALKTITLE TEXT.</p>
          </div>

          <div class="speaker-abstract-row">
            <h3>Abstract</h3>
            <p id="speaker-abstract">PLACEHOLDER ABSTRACT TEXT.</p>
          </div>
        </div>

      </div>
    </div>

  </section>

</main>

<script src="cache-utils.js"></script>
<script>
  if (window.cacheUtils && typeof window.cacheUtils.setupAutoUpdateCheck === 'function') {
    window.cacheUtils.setupAutoUpdateCheck({ versionUrl: 'site-version.json', intervalMs: 120000 });
  }
</script>
<script src="load-footer.js"></script>
<script src="load-header.js"></script>
<script src="load-hero.js"></script>
<script src="speaker.js"></script>
<script src="page-loader.js"></script>
<script src="banner.js"></script>




</div>

</body>

</html>
